#cloud-config
# User-data snippet for the GPU worker nodes (cicustom).
#
# Copy to the Proxmox host as /var/lib/vz/snippets/user_data_vm-<VMID>.yml
# (VMID 501, 502, ...) and fill in the placeholders. "#cloud-config" must stay
# on the first line or cloud-init ignores the file.
#
# Generate the password hash with:  mkpasswd -m sha-512
# Never commit a real hash or key to git.
hostname: kube-agent-gpu-01

groups:
  - admin

users:
  - default
  - name: admin
    passwd: "<sha-512-password-hash>"
    shell: /bin/bash
    lock_passwd: false
    primary_group: admin
    groups: sudo
    ssh_authorized_keys:
      - "<ssh-public-key>"
